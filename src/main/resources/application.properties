spring.application.name=Inventario

# Aplicação de console (sem servidor web) e saída limpa no terminal
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN

# Banco de dados H2 gravado em arquivo (pasta ./data) - os dados permanecem entre as execuções
spring.datasource.url=jdbc:h2:file:./data/inventario;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate cria e atualiza a tabela TB_PRODUTO automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
